name: Bug Report
description: Report a bug or unexpected behavior in Brainrot
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please check existing
        issues first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction code
      description: >
        The smallest `.brainrot` snippet that reproduces the issue. Attach a
        `.brainrot` file instead if the snippet is long.
      render: c
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include the complete error message or output.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Brainrot version / commit
      description: Output of `git rev-parse HEAD` or the release version, if applicable.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 22.04, macOS 14, WSL2
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: >
        Anything else relevant — valgrind output, sanitizer output, related
        issues, etc.
    validations:
      required: false
