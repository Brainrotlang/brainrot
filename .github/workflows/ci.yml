name: Brainrot CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "CODEOWNERS"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "CODEOWNERS"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Force Ubuntu archive mirror
        run: |
          sudo sed -i \
            's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt

      - name: Install clang-format
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
          install clang-format -y

      - name: Check formatting
        run: make format-check

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Force Ubuntu archive mirror
        run: |
          sudo sed -i \
            's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt

      - name: Install build dependencies
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
          install gcc flex bison libfl-dev libasan8 libubsan1 -y

      - name: Build Brainrot
        run: |
          make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: brainrot
          path: |
            brainrot
            libstdrot.so

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Brainrot artifact
        uses: actions/download-artifact@v8
        with:
          name: brainrot
          path: .

      - name: Grant execute permissions to Brainrot
        run: chmod +x brainrot

      - name: Force Ubuntu archive mirror
        run: |
          sudo sed -i \
            's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt

      - name: Install Python and dependencies
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
          install gcc python3 python3-pip valgrind libfl-dev libasan8 libubsan1 -y
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
        working-directory: tests

      # tests/libstdrot.so is production stdrot/*.c PLUS tests/stdrot/*.c
      # (test-only natives that exist solely so test_cases/*.brainrot can
      # exercise ABI paths no production builtin uses, e.g. STDROT_PTR --
      # see that directory's own file comment). Built fresh here rather
      # than reusing the downloaded libstdrot.so build artifact, which is
      # deliberately production-only, the same file `make install` and
      # the wasm build see.
      - name: Build test-only shared library
        run: make tests/libstdrot.so

      - name: Run Pytest
        run: |
          source .venv/bin/activate
          export STDROT_LIB_PATH="$GITHUB_WORKSPACE/tests/libstdrot.so"
          pytest -v test_brainrot.py
        working-directory: tests

      - name: Run Valgrind on all .brainrot tests
        run: |
          chmod +x run_valgrind_tests.sh
          export STDROT_LIB_PATH="$GITHUB_WORKSPACE/tests/libstdrot.so"
          ./run_valgrind_tests.sh
        working-directory: .

  wasm:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download native Brainrot artifact
        uses: actions/download-artifact@v8
        with:
          name: brainrot
          path: .

      - name: Grant execute permissions to native Brainrot
        run: chmod +x brainrot

      - name: Force Ubuntu archive mirror
        run: |
          sudo sed -i \
            's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt

      - name: Install build dependencies
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
          install bison flex libfl-dev libasan8 libubsan1 -y

      - name: Set up Emscripten
        # mymindstorm/setup-emsdk was transferred to emscripten-core/setup-emsdk;
        # SHA-pinned (v14) so a retagged release can't silently change what
        # builds the artifact the playground will consume.
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 3.1.73

      - name: Build brainrot.wasm
        run: make wasm

      - name: Run wasm smoke tests
        run: node tests/run_wasm_tests.mjs

      - name: Compare wasm output against native for examples/
        run: node tests/run_wasm_examples_check.mjs

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v7
        with:
          name: brainrot-wasm
          path: |
            brainrot.wasm
            brainrot.mjs
